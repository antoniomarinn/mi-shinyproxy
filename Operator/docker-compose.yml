services:
  shinyproxy-dev:
    image: openanalytics/shinyproxy:3.2.3
    container_name: shinyproxy-dev-standalone
    # Mapeamos el puerto interno de Java (8080) al tuyo (8085)
    ports:
      - "8085:8080"
    volumes:
      # Le pasamos tu archivo YAML
      - ./input/localhost.shinyproxy.yaml:/opt/shinyproxy/application.yml
      # Le pasamos tus plantillas
      - ./input/templates:/opt/shinyproxy/templates
      # Le damos acceso a Docker para que pueda crear los contenedores de R
      - /var/run/docker.sock:/var/run/docker.sock:ro
    group_add:
      - "998"
    networks:
      - sp-shared-network-dev
    restart: always

  influxdb-dev:
    image: influxdb:1.8
    container_name: sp-influxdb-dev
    restart: always
    environment:
      - INFLUXDB_DB=shinyproxy_statistics_dev
    volumes:
      - ./influxdb-data:/var/lib/influxdb
    networks:
      - sp-shared-network-dev

  grafana-dev:
    image: grafana/grafana:latest
    container_name: sp-grafana-dev
    restart: always
    depends_on:
      - influxdb-dev
    ports:
      - "3001:3000"
    volumes:
      - ./grafana-data:/var/lib/grafana
    networks:
      - sp-shared-network-dev

networks:
  sp-shared-network-dev:
    name: sp-shared-network-dev
    driver: bridge
